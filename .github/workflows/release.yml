name: Create a release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-22.04
    container:
      image: qgis/qgis:release-3_34
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Python command
        run: apt-get install python-is-python3

      - name: Install python
        uses: actions/setup-python@v5

      - name: Install plugin dependencies
        run: pip install -r requirements-dev.txt

      - name: Get version and experimental info
        id: get-metadata
        run: |
          echo "VERSION=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('metadata.txt'); print(c.get('general', 'version'))")" >> "$GITHUB_OUTPUT"
          echo "IS_EXPERIMENTAL=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('metadata.txt'); print(str(c.get('general', 'experimental', fallback='False')).lower())")" >> "$GITHUB_OUTPUT"

      - name: Generate zip
        run: python admin.py generate-zip

      - name: Get zip details
        id: get-zip-details
        run: |
          echo "ZIP_PATH=dist/$(ls dist)" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=$(ls dist)" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Check if release exists
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME exists, uploading asset..."
            gh release upload "$TAG_NAME" "${{ steps.get-zip-details.outputs.ZIP_PATH }}" --clobber
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --prerelease=${{ steps.get-metadata.outputs.IS_EXPERIMENTAL }} \
              "${{ steps.get-zip-details.outputs.ZIP_PATH }}"
          fi

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Update custom plugin repository to include latest release
        run: |
          python admin.py --verbose generate-plugin-repo-xml
          echo " " >> docs/repository/plugins.xml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory /__w/sg-diagram-downloader/sg-diagram-downloader

          git add -A
          git commit -m "Update on plugins.xml"
          git push origin release
