# Bandit configuration file for SG Diagram Downloader security scanning
# https://bandit.readthedocs.io/en/latest/config.html

exclude_dirs:
  - ./test
  - ./test/**

# Skip B101 (assert statements) as they are legitimate in test files
skips:
  - B101

